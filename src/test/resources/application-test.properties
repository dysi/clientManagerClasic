# Isolated database: tests never use the configured MySQL schema.
spring.datasource.url=jdbc:h2:mem:clientmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# H2 crea el modelo aislado; no verifica migraciones MySQL.
spring.liquibase.enabled=false
spring.jpa.show-sql=false
jwt.secret=isolated-test-secret

# Archivos aislados de cualquier almacenamiento real.
portal.files.directory=${java.io.tmpdir}/clientmanager-test-receipts-${random.uuid}
portal.files.reconcile-delay-ms=3600000

# Nunca enviar correos reales desde la suite aislada.
mail.enable=false

# No ejecutar purgas programadas mientras se verifican datos aislados de prueba.
license.query-log.cleanup-cron=-

# La suite aislada no depende de servicios externos.
portal.turnstile.enabled=false
