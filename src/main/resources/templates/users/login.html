<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <title>Ingreso de Usuario</title>
  <th:block th:include="shared/header :: header"></th:block>
  
</head>

<body class="login-gradient">
<div class="container py-5">
  <div class="row">
    <div class="col-md-12">
      <h2 class="text-center text-white mb-4">AngryBox Gestor de Clientes</h2>
      <div class="row">
        <div class="col-xs-12 col-md-6 mx-auto alert alert-warning" role="alert"
             data-bind="visible: errorAlertMsg">
          <p data-bind="text: errorAlertMsg"></p>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mx-auto">
          <span class="anchor"></span>
          <!-- form card login -->
          <div class="card rounded-0">
            <div class="card-header">
              <h3 class="mb-0">Ingresar</h3>
            </div>
            <div class="card-body">
              <form class="form" role="form" autocomplete="off" id="loginForm">
                <div class="form-group">
                  <label for="username">Nombre de usuario</label>
                  <input type="text" class="form-control form-control-lg rounded-0" name="username" id="username"
                         data-bind="value: username"
                  />
                </div>
                <div class="form-group">
                  <label>Contraseña</label>
                  <input type="password" class="form-control form-control-lg rounded-0" id="password" name="password"
                         data-bind="value: password"
                  />
                </div>
                <button type="submit" class="btn btn-success btn-block float-right"
                        data-bind="click: onSubmit, enable: username">
                  <span data-bind="visible: !isLoading()">Ingresar</span>
                  <i data-bind="visible: isLoading" class="fa fa-circle-o-notch fa-spin fa-2x fa-fw"></i>
                </button>
              </form>
            </div>
            <!--/card-block-->
          </div>
          <!-- /form card login -->
        </div>
      </div>
      <!--/row-->
    </div>
    <!--/col-->
  </div>
  <!--/row-->
</div>
<!--/container-->

<th:block th:include="shared/footer :: footer"></th:block>
<script type="text/javascript" src="/clientmanager/js/vm/vm.user-login.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/ VMUserLogin([[${message}]], [[${port}]]) /*]]>*/
</script>

</body>

</html>
