# Variables para ambiente de DESARROLLO
server.port=3000
server.servlet.context-path=/clientmanager
spring.datasource.url = jdbc:mysql://localhost:3306/dysi-clientmanager-20261026
spring.datasource.username = root
spring.datasource.password = dysi2010

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto = update

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Preserve the ID generator behavior used by Spring Boot 1.5.
spring.jpa.hibernate.use-new-id-generator-mappings=false

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager)

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Recepcion de la fotografia completa de clientes/deudas desde una unica empresa Angrybox.
# Requiere Bearer con el authority configurado. No usar Client.id ni License.id como empresa.
# Angrybox toma el valor del parámetro ID 12 (EmpresaId)
angrybox.sync.enabled=true
angrybox.sync.source-company-id=1
# Permiso explicito: ADMIN por si solo no concede acceso. Asignable desde Usuarios > Acceso API.
angrybox.sync.required-authority=ROLE_API
# EXTERNAL_CODE: codigoExterno de Angrybox contra Client.externalCode; ID: contra Client.id.
angrybox.sync.code-target=ID
# CODE, DOCUMENT, CODE_AND_DOCUMENT (ambos obligatorios), CODE_OR_DOCUMENT (sin contradicciones).
angrybox.sync.matching-mode=CODE_AND_DOCUMENT
# Tolerancia de reloj para rechazar fotografias con fecha excesivamente futura.
angrybox.sync.max-future-seconds=300