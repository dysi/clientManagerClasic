# Archivo ASCII compatible con editores UTF-8 e ISO-8859-1.
# Los valores usan escapes Unicode de .properties; el correo conserva acentos y enie.
# Guardar este archivo en UTF-8: admite acentos y N sin escapes Unicode.
# Archivo externo: --clientmanager.mail.config=file:C:/config/clientmanager-mail.properties
# Requiere reiniciar la aplicacion al modificarlo. No versionar credenciales reales.
mail.enable=${CLIENTMANAGER_MAIL_ENABLED:false}
mail.host=${CLIENTMANAGER_MAIL_HOST:mail.dysi.com.ar}
mail.port=${CLIENTMANAGER_MAIL_PORT:587}
mail.username=${CLIENTMANAGER_MAIL_USERNAME:}
mail.password=${CLIENTMANAGER_MAIL_PASSWORD:}
mail.from=${CLIENTMANAGER_MAIL_FROM:info@dysi.com.ar}
# Si tiene valor, REEMPLAZA todos los destinatarios reales (tambien futuras notificaciones).
# Dejar vacio para enviar a los destinatarios de cada correo. Admite listas separadas por ;.
mail.to-test=${CLIENTMANAGER_MAIL_TO_TEST:}
mail.transport.protocol=smtp
mail.smtp.auth=true
mail.smtp.ssl.enable=false
mail.smtp.ssl.protocols=TLSv1.2
mail.smtp.ssl.trust=mail.dysi.com.ar
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true
# Habilitar solo para diagnostico controlado: JavaMail puede mostrar metadatos del correo.
mail.debug=false
# -1 o 0 deshabilita la espera; 1..86400 segundos entre intentos, incluidos fallidos.
# Cola FIFO en memoria (maximo 1000 pendientes): no demora el alta ni descarta por el intervalo.
# No hay reintentos. Al detener/reiniciar se pierden los pendientes; descartes/fallos registran ERROR.
mail.tiempo-min-entre-mensajes-seg=90

# URL publica absoluta de produccion, con contexto si corresponde, SIN /ui ni fragmento #.
# Ejemplo de formato: https://dominio-de-la-plataforma/clientmanager
clientmanager.public-url=${CLIENTMANAGER_PUBLIC_URL:}

mail.builder.alert-payment-active=true
# Destinatarios separados por punto y coma; se envian en copia oculta (BCC).
mail.builder.alert-payment-to=${CLIENTMANAGER_PAYMENT_ALERT_TO:}
# Variables permitidas (definicion y descripcion en PaymentMailVariable):
# {{cliente-nombre}} / {{nombre-cliente}}: nombre y apellido del cliente.
# {{cliente-id}}: ID interno del cliente. {{pago-id}}: ID del pago.
# {{pago-monto}}: importe es-AR sin simbolo. {{pago-moneda}}: ARS.
# {{pago-emision}}: emision local informada. {{pago-comprobantes}}: cantidad inicial.
# {{pagos-pendientes-url}}: enlace al listado filtrado por PENDIENTE; exige acceso ADMIN.
# Variables desconocidas cancelan la alerta y registran ERROR. Valores HTML siempre escapados.
# El HTML lo administra el operador; usar variables en texto o atributos entre comillas dobles.
mail.builder.alert-payment-asunto=ClientManager | Pago #{{pago-id}} pendiente de revisi\u00f3n | {{pago-moneda}} $ {{pago-monto}} | {{cliente-nombre}}
mail.builder.alert-payment-body=<html><body><h2>Nuevo pago pendiente de revisi\u00f3n</h2><p>Se registr\u00f3 una presentaci\u00f3n de pago en ClientManager. Revis\u00e1 la informaci\u00f3n y los comprobantes antes de aprobarla o rechazarla.</p><ul><li><strong>Cliente:</strong> {{cliente-nombre}} (ID {{cliente-id}})</li><li><strong>Pago:</strong> #{{pago-id}}</li><li><strong>Importe informado:</strong> {{pago-moneda}} $ {{pago-monto}}</li><li><strong>Emisi\u00f3n informada:</strong> {{pago-emision}}</li><li><strong>Comprobantes adjuntos:</strong> {{pago-comprobantes}}</li><li><strong>Estado al presentar:</strong> Pendiente</li></ul><p><a href="{{pagos-pendientes-url}}">Ingresar a revisar los pagos pendientes</a></p><p>Ingres\u00e1 con una cuenta administradora, busc\u00e1 el n\u00famero de pago indicado y verific\u00e1 la acreditaci\u00f3n. Si rechaz\u00e1s la presentaci\u00f3n, indic\u00e1 un motivo p\u00fablico para el cliente.</p><p>Este aviso no confirma la acreditaci\u00f3n ni la aprobaci\u00f3n. El pago puede haber sido revisado al momento de abrir el enlace.</p><p>Notificaci\u00f3n autom\u00e1tica de ClientManager.</p></body></html>
