# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# Show or not log for each sql query
spring.jpa.show-sql = true

# Liquibase administra el esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto = validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Preserve the ID generator behavior used by Spring Boot 1.5.
spring.jpa.hibernate.use-new-id-generator-mappings=false

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager)

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect


# Browser sessions; Secure is automatic over HTTPS (or set SERVER_SERVLET_SESSION_COOKIE_SECURE=true).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Comprobantes privados: usar un directorio persistente y respaldarlo junto con la BD.
portal.files.directory=${CLIENTMANAGER_RECEIPTS_DIRECTORY:${user.home}/.clientmanager/receipts}
portal.files.max-receipts=5
portal.files.max-file-bytes=10485760
portal.files.max-pixels=40000000
portal.files.max-dimension=12000
portal.files.max-image-side=1000
portal.files.image-quality=0.8
portal.files.orphan-grace-seconds=86400
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
server.tomcat.max-swallow-size=52MB

# Ayuda publica en login y portal: numero internacional; admite +, espacios, parentesis y guiones.
portal.support.whatsapp-phone=${CLIENTMANAGER_WHATSAPP_PHONE:+54 9 2634 22-3523}

# Fecha de negocio para sugerencias y confirmación de la revisión administrativa.
portal.review.time-zone=${CLIENTMANAGER_PAYMENT_TIME_ZONE:America/Argentina/Buenos_Aires}

# Recepcion de la fotografia completa de clientes/deudas desde una unica empresa Angrybox.
# Requiere Bearer con el authority configurado. No usar Client.id ni License.id como empresa.
angrybox.sync.enabled=${CLIENTMANAGER_ANGRYBOX_SYNC_ENABLED:false}
# Propaga baja=true como baja logica auditada; no reactiva clientes ni elimina deudas.
angrybox.sync.sync-deactivations=${CLIENTMANAGER_ANGRYBOX_SYNC_DEACTIVATIONS:false}
angrybox.sync.source-company-id=${CLIENTMANAGER_ANGRYBOX_SYNC_COMPANY_ID:}
# Permiso explicito: ADMIN por si solo no concede acceso. Asignable desde Usuarios > Acceso API.
angrybox.sync.required-authority=${CLIENTMANAGER_ANGRYBOX_SYNC_REQUIRED_AUTHORITY:ROLE_API}
# EXTERNAL_CODE: codigoExterno de Angrybox contra Client.externalCode; ID: contra Client.id.
angrybox.sync.code-target=${CLIENTMANAGER_ANGRYBOX_SYNC_CODE_TARGET:EXTERNAL_CODE}
# CODE, DOCUMENT, CODE_AND_DOCUMENT (ambos obligatorios), CODE_OR_DOCUMENT (sin contradicciones).
angrybox.sync.matching-mode=${CLIENTMANAGER_ANGRYBOX_SYNC_MATCHING_MODE:CODE_AND_DOCUMENT}
# Tolerancia de reloj para rechazar fotografias con fecha excesivamente futura.
angrybox.sync.max-future-seconds=${CLIENTMANAGER_ANGRYBOX_SYNC_MAX_FUTURE_SECONDS:300}

# SMTP y plantillas: mail.properties (lectura explicita UTF-8).
# Archivo externo completo: --clientmanager.mail.config=file:C:/config/clientmanager-mail.properties

# Duracion del certificado temporal por presentacion (1 a 87600 horas).
portal.license-extension.hours=${CLIENTMANAGER_LICENSE_EXTENSION_HOURS:72}
# Habilita la solicitud manual del portal; no afecta certificados existentes ni emisiones por pago.
portal.license-extension.manual-request-enabled=${CLIENTMANAGER_LICENSE_EXTENSION_MANUAL_REQUEST_ENABLED:true}

# Bitacora de consultas de licencia: retencion en dias de 24 h y purga fisica diaria por lotes.
license.query-log.retention-days=${CLIENTMANAGER_LICENSE_QUERY_RETENTION_DAYS:90}
license.query-log.cleanup-cron=${CLIENTMANAGER_LICENSE_QUERY_CLEANUP_CRON:0 0 3 * * *}
license.query-log.time-zone=${CLIENTMANAGER_LICENSE_QUERY_TIME_ZONE:America/Argentina/Buenos_Aires}

# Verificación antibots del login web. Configurar las claves fuera del repositorio.
# Interruptor general: cambiar true por false para desactivarlo y reiniciar el backend.
# Alternativa sin editar archivos: CLIENTMANAGER_TURNSTILE_ENABLED=false.
# El perfil dev usa false por defecto; la variable permite sobreescribirlo.
portal.turnstile.enabled=${CLIENTMANAGER_TURNSTILE_ENABLED:false}
portal.turnstile.site-key=${CLIENTMANAGER_TURNSTILE_SITE_KEY:}
portal.turnstile.secret-key=${CLIENTMANAGER_TURNSTILE_SECRET_KEY:}
portal.turnstile.hostnames=${CLIENTMANAGER_TURNSTILE_HOSTNAMES:}
